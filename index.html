<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Fotografico - Portfolio</title>
  
  <!-- StPageFlip CSS/JS da CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-weight: 300;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #eaeaea;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-top: 5px;
    }

    /* Container del libro */
    .container {
      width: 100%;
      max-width: 1000px;
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    .flip-book {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background-size: cover;
    }

    /* Stile delle Pagine */
    .page {
      padding: 20px;
      background-color: #fff;
      color: #222;
      border: 1px solid #ddd;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Copertina iniziale e finale */
    .page.--cover {
      background-color: #111;
      color: #fff;
      border: none;
    }

    .page.--cover h2 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-bottom: 2px solid #00ffcc;
      padding-bottom: 10px;
    }

    /* Immagini/Pagine Interne */
    .page-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .demo-box {
      width: 100%;
      height: 80%;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 1.2rem;
      color: #666;
      border: 2px dashed #ccc;
    }

    .caption {
      font-size: 0.85rem;
      color: #555;
      margin-top: 10px;
      text-align: center;
      font-style: italic;
    }

    .page-footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* Controlli di navigazione sotto al libro */
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #00ffcc;
      color: #111;
      border-color: #00ffcc;
    }
  </style>
</head>
<body>

  <header>
    <h1>IL MIO PORTFOLIO</h1>
    <p class="subtitle">Clicca sugli angoli o usa i pulsanti per sfogliare</p>
  </header>

  <div class="container">
    <div id="book" class="flip-book">
      
      <!-- COPERTINA -->
      <div class="page --cover" data-density="hard">
        <h2>PORTFOLIO</h2>
        <p style="margin-top:20px; color:#aaa;">Opere & Fotografie</p>
      </div>

      <!-- PAGINA 1 -->
      <div class="page">
        <div class="page-content">
          <div class="demo-box">[ Foto 1 ]</div>
          <div class="caption">Titolo dell'Opera N.1 (2026)</div>
        </div>
        <div class="page-footer">1</div>
      </div>

      <!-- PAGINA 2 -->
      <div class="page">
        <div class="page-content">
          <div class="demo-box">[ Foto 2 ]</div>
          <div class="caption">Titolo dell'Opera N.2</div>
        </div>
        <div class="page-footer">2</div>
      </div>

      <!-- PAGINA 3 -->
      <div class="page">
        <div class="page-content">
          <div class="demo-box">[ Foto 3 ]</div>
          <div class="caption">Titolo dell'Opera N.3</div>
        </div>
        <div class="page-footer">3</div>
      </div>

      <!-- PAGINA 4 -->
      <div class="page">
        <div class="page-content">
          <div class="demo-box">[ Foto 4 ]</div>
          <div class="caption">Titolo dell'Opera N.4</div>
        </div>
        <div class="page-footer">4</div>
      </div>

      <!-- COPERTINA FINALE -->
      <div class="page --cover" data-density="hard">
        <h2>FINE</h2>
        <p style="margin-top:20px; color:#aaa;">Grazie per la visione</p>
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="btn-prev">← Indietro</button>
    <button id="btn-next">Avanti →</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pageFlip = new St.PageFlip(
        document.getElementById('book'),
        {
          width: 400, // Larghezza singola pagina su desktop
          height: 550, // Altezza singola pagina
          size: "fixed",
          minWidth: 280,
          maxWidth: 500,
          minHeight: 400,
          maxHeight: 700,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false // Abilita il tocco e lo sfoglio su smartphone
        }
      );

      // Carica il libro
      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      // Eventi pulsanti
      document.getElementById('btn-prev').addEventListener('click', () => {
        pageFlip.flipPrev();
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        pageFlip.flipNext();
      });
    });
  </script>

</body>
</html>
