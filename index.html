<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Fotografico - Pagina Singola</title>
  
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    /* Container ingrandito (occupa fino al 90% della larghezza dello schermo) */
    .container {
      width: 90%;
      max-width: 900px; /* Dimensione massima per la pagina singola */
      height: 80vh;     /* Occupa l'80% dell'altezza dello schermo */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flip-book {
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    }

    /* Stile generale Pagine */
    .page {
      background-color: #fff;
      color: #222;
      border: 1px solid #ddd;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* COPERTINA PERSONALIZZABILE CON IMMAGINE */
    .page.--cover {
      /* Decommenta e inserisci l'URL della tua foto di copertina: */
      /* background-image: url('foto/copertina.jpg'); */
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a;
      color: #fff;
      border: none;
    }

    .page.--cover h2 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      border-bottom: 2px solid #00ffcc;
      padding-bottom: 10px;
    }

    /* Contenuto Foto */
    .page-content {
      width: 100%;
      height: 100%;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .photo-frame {
      width: 100%;
      height: 85%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      overflow: hidden;
    }

    /* Se usi un'immagine reale dentro la pagina */
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Mantiene le proporzioni della foto senza tagliarla */
    }

    .caption {
      font-size: 1rem;
      color: #444;
      margin-top: 15px;
      font-style: italic;
    }

    .page-footer {
      position: absolute;
      bottom: 12px;
      font-size: 0.8rem;
      color: #999;
    }

    /* Controlli */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 20px;
    }

    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #00ffcc;
      color: #111;
      border-color: #00ffcc;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="book" class="flip-book">
      
      <!-- COPERTINA -->
      <div class="page --cover" data-density="hard">
        <h2>PORTFOLIO</h2>
        <p style="margin-top:15px; color:#ccc;">Edizione Singola</p>
      </div>

      <!-- PAGINA 1 -->
      <div class="page">
        <div class="page-content">
          <div class="photo-frame">
            <!-- Sostituisci il testo qui sotto con il tag <img> della tua foto:
            <img src="foto/opera1.jpg" alt="Opera 1"> -->
            <span style="color:#888;">[ Inserisci qui la Foto 1 ]</span>
          </div>
          <div class="caption">Titolo dell'Opera N. 1</div>
        </div>
        <div class="page-footer">1</div>
      </div>

      <!-- PAGINA 2 -->
      <div class="page">
        <div class="page-content">
          <div class="photo-frame">
            <span style="color:#888;">[ Inserisci qui la Foto 2 ]</span>
          </div>
          <div class="caption">Titolo dell'Opera N. 2</div>
        </div>
        <div class="page-footer">2</div>
      </div>

      <!-- COPERTINA FINALE -->
      <div class="page --cover" data-density="hard">
        <h2>FINE</h2>
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="btn-prev">← Indietro</button>
    <button id="btn-next">Avanti →</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pageFlip = new St.PageFlip(
        document.getElementById('book'),
        {
          width: 650,                // Larghezza della singola pagina
          height: 900,               // Altezza della singola pagina
          size: "stretch",
          minWidth: 300,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: false,          // DISABILITA LA VISTA A LIBRO APERTO
          usePortrait: true,         // FORZA LA PAGINA SINGOLA
          showOnlyLandscape: false,  // IMPEDISCE DI MOSTRARE 2 PAGINE SU SCHERMI LARGH
          mobileScrollSupport: false
        }
      );

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      document.getElementById('btn-prev').addEventListener('click', () => {
        pageFlip.flipPrev();
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        pageFlip.flipNext();
      });
    });
  </script>
