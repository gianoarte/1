<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Mio Portfolio Fotografico 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #0d0d11;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    /* Interfaccia utente fluttuante */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 28, 0.7);
      backdrop-filter: blur(8px);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    #ui-container h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    #ui-container p {
      font-size: 0.85rem;
      color: #a0a0b0;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h1>Galleria Fotografica 3D</h1>
    <p>Trascina per ruotare la visuale | Usa lo scroll per lo zoom</p>
  </div>

  <!-- Librerie Three.js e OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. CONFIGURAZIONE SCENA, FOTOCAMERA E RENDERER
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d11);
    scene.fog = new THREE.FogExp2(0x0d0d11, 0.04);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // Controlli di navigazione con il mouse/touch
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1; // Impedisce di andare sotto il pavimento

    // 2. ILLUMINAZIONE E AMBIENTE
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Pavimento riflettente scuro
    const floorGeo = new THREE.PlaneGeometry(50, 50);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x15151e,
      roughness: 0.2,
      metalness: 0.5
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.5;
    scene.add(floor);

    // 3. SOSTITUISCI QUESTI URL CON LE TUE FOTO
    // Esempio con le tue foto caricate su GitHub: './foto/mia_foto1.webp'
    const imageUrls = [
      'https://picsum.photos/id/1015/800/600',
      'https://picsum.photos/id/1018/800/600',
      'https://picsum.photos/id/1025/800/600',
      'https://picsum.photos/id/1039/800/600',
      'https://picsum.photos/id/1043/800/600',
      'https://picsum.photos/id/1050/800/600',
      'https://picsum.photos/id/1062/800/600',
      'https://picsum.photos/id/1069/800/600'
    ];

    const textureLoader = new THREE.TextureLoader();
    const radius = 5.5; // Raggio del cerchio espositivo

    // 4. GENERAZIONE DEI QUADRI
    imageUrls.forEach((url, index) => {
      const angle = (index / imageUrls.length) * Math.PI * 2;

      // Texture della foto
      const texture = textureLoader.load(url);
      const photoGeo = new THREE.PlaneGeometry(2.4, 1.8);
      const photoMat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.2
      });
      const photoMesh = new THREE.Mesh(photoGeo, photoMat);

      // Cornice nera posteriore
      const frameGeo = new THREE.BoxGeometry(2.55, 1.95, 0.08);
      const frameMat = new THREE.MeshStandardMaterial({
        color: 0x050505,
        roughness: 0.5
      });
      const frameMesh = new THREE.Mesh(frameGeo, frameMat);
      frameMesh.position.z = -0.05;

      // Gruppo che racchiude foto e cornice
      const pictureGroup = new THREE.Group();
      pictureGroup.add(photoMesh);
      pictureGroup.add(frameMesh);

      // Posizionamento in cerchio
      pictureGroup.position.x = Math.sin(angle) * radius;
      pictureGroup.position.z = Math.cos(angle) * radius;
      pictureGroup.position.y = 0;

      // Orienta il quadro verso il centro della scena
      pictureGroup.lookAt(0, 0, 0);

      scene.add(pictureGroup);
    });

    // 5. LOOP DI ANIMAZIONE E ADATTAMENTO FINESTRA
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
