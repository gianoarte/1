<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Pagina Singola</title>
  
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Dimensione dell'unica scheda/pagina al centro */
    .swiper {
      width: 100%;
      max-width: 520px;
      height: 75vh;
      max-height: 750px;
    }

    /* Stile della singola pagina */
    .swiper-slide {
      background: #ffffff;
      color: #222222;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 25px;
      overflow: hidden;
    }

    /* Copertine */
    .swiper-slide.--cover {
      background: #1a1a1a;
      color: #ffffff;
      text-align: center;
      justify-content: center;
    }

    .swiper-slide.--cover h2 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      border-bottom: 2px solid #00ffcc;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    /* Spazio Immagine */
    .photo-frame {
      width: 100%;
      height: 82%;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px dashed #ccc;
      overflow: hidden;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      font-size: 1rem;
      color: #444;
      font-style: italic;
      margin-top: 10px;
    }

    .page-num {
      font-size: 0.8rem;
      color: #888;
      align-self: flex-end;
    }

    /* Controlli */
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 20px;
    }

    button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #00ffcc;
      color: #111;
      border-color: #00ffcc;
    }
  </style>
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      
      <!-- COPERTINA -->
      <div class="swiper-slide --cover">
        <h2>PORTFOLIO</h2>
        <p style="color:#aaa;">Album Fotografico</p>
      </div>

      <!-- PAGINA 1 -->
      <div class="swiper-slide">
        <div class="photo-frame">
          <!-- <img src="foto/opera1.jpg" alt="Foto 1"> -->
          <span style="color:#888;">[ Inserisci qui la Foto 1 ]</span>
        </div>
        <div class="caption">Opera N. 1</div>
        <div class="page-num">1</div>
      </div>

      <!-- PAGINA 2 -->
      <div class="swiper-slide">
        <div class="photo-frame">
          <span style="color:#888;">[ Inserisci qui la Foto 2 ]</span>
        </div>
        <div class="caption">Opera N. 2</div>
        <div class="page-num">2</div>
      </div>

      <!-- PAGINA 3 -->
      <div class="swiper-slide">
        <div class="photo-frame">
          <span style="color:#888;">[ Inserisci qui la Foto 3 ]</span>
        </div>
        <div class="caption">Opera N. 3</div>
        <div class="page-num">3</div>
      </div>

      <!-- PAGINA 4 -->
      <div class="swiper-slide">
        <div class="photo-frame">
          <span style="color:#888;">[ Inserisci qui la Foto 4 ]</span>
        </div>
        <div class="caption">Opera N. 4</div>
        <div class="page-num">4</div>
      </div>

      <!-- COPERTINA FINALE -->
      <div class="swiper-slide --cover">
        <h2>FINE</h2>
        <p style="color:#aaa;">Grazie per la visione</p>
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="btn-prev">← Indietro</button>
    <button id="btn-next">Avanti →</button>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const swiper = new Swiper(".mySwiper", {
      effect: "cards",        // Effetto mazzo di carte 3D a pagina singola
      grabCursor: true,      // Permette lo scorrimento trascinando col mouse o col dito
      perSlideRotate: 2,     // Lieve inclinazione 3D
      perSlideOffset: 8,     // Profondità tra le schede
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      swiper.slidePrev();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      swiper.slideNext();
    });
  </script>

</body>
</html>
